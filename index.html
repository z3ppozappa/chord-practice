<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Tone Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="settings">
      <div class="settings-grid">
        <label>Scale
          <select id="scale-select">
            <option value="major">Major</option>
            <option value="harmonicMinor">Harmonic Minor</option>
            <option value="pentatonic">Pentatonic</option>
            <option value="random">Random</option>
          </select>
        </label>
        <label>Key Center
          <select id="mode-select">
            <option value="random">Random</option>
          </select>
        </label>
        <label>Position
          <select id="position-select">
            <option value="0">Root</option>
            <option value="-1">Random</option>
          </select>
        </label>
        <label>Chord
          <select id="chord-select">
            <option value="random">Random</option>
          </select>
        </label>
        <label>Strings
          <select id="string-preset">
            <option value="all">All</option>
            <option value="high">High (e, B, G)</option>
            <option value="middle">Middle (B, G, D)</option>
            <option value="low">Low (D, A, E)</option>
            <option value="custom">Custom</option>
          </select>
        </label>
      </div>
      <div id="custom-strings" class="hidden"></div>
      <div class="settings-row">
        <label><input type="checkbox" id="show-mode" checked> Show mode name</label>
        <label><input type="checkbox" id="show-chord" checked> Show chord name</label>
        <label><input type="checkbox" id="show-degrees"> Scale degrees</label>
        <label><input type="checkbox" id="parent-key-degrees"> Parent key</label>
      </div>
    </header>

    <main id="game">
      <div id="prompt">
        <span id="mode-name"></span>
        <span id="shape-info" class="hidden"></span>
        <span id="parent-key-info" class="hidden"></span>
        <div id="find-prompt"></div>
      </div>

      <div id="fretboard-container"></div>

      <div id="progress"></div>

      <div id="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Round</span>
          <span class="stat-value" id="round-num">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Round</span>
          <span class="stat-value" id="round-timer">0:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Session</span>
          <span class="stat-value" id="session-timer">0:00</span>
        </div>
      </div>

      <button id="next-btn" class="hidden">Next Round (Space)</button>
    </main>
  </div>

  <script src="js/scales.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
