<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chord Tone Finder</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChordTones">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="app">
    <div id="tab-bar">
      <button class="tab active" data-view="fretboard">Scale Finder</button>
      <button class="tab" data-view="triad-quiz">Triad Quiz</button>
      <button class="tab" data-view="dashboard">Dashboard</button>
    </div>

    <div id="fretboard-view">
      <header id="settings">
        <div class="settings-grid">
          <label>Scale
            <select id="scale-select">
              <option value="major">Major</option>
              <option value="harmonicMinor">Harmonic Minor</option>
              <option value="pentatonic">Pentatonic</option>
              <option value="random">Random</option>
            </select>
          </label>
          <label>Key
            <select id="key-select">
              <option value="random">Random</option>
            </select>
          </label>
          <label>Key Center
            <select id="mode-select">
              <option value="random">Random</option>
            </select>
          </label>
          <label>Position
            <select id="position-select">
              <option value="-1">Random</option>
              <option value="0">Root</option>
            </select>
          </label>
          <label>Chord
            <select id="chord-select">
              <option value="random">Random</option>
            </select>
          </label>
          <label>Strings
            <select id="string-preset">
              <option value="all">All</option>
              <option value="top4">Top 4 (e, B, G, D)</option>
              <option value="mid4">Mid 4 (B, G, D, A)</option>
              <option value="high">High (e, B, G)</option>
              <option value="highMid">High Mid (B, G, D)</option>
              <option value="lowMid">Low Mid (G, D, A)</option>
              <option value="low">Low (D, A, E)</option>
            </select>
          </label>
          <button type="button" id="hard-mode" class="settings-toggle">Hard Mode</button>
          <button type="button" id="show-chord" class="settings-toggle">Show Chord</button>
        </div>
      </header>

      <main id="game">
        <div id="prompt-row">
          <div id="prompt">
            <span id="mode-name"></span>
            <span id="shape-info" class="hidden"></span>

            <div id="find-prompt"></div>
            <div id="chord-list"></div>
          </div>
          <button id="next-btn" disabled>Next ▶</button>
        </div>

        <div id="fretboard-container"></div>

        <div id="progress"></div>

        <div id="badges"></div>

        <div id="best-time-display">
          <span class="best-label">Best</span>
          <span class="best-value" id="best-time">--</span>
        </div>

        <div id="batch-dots"></div>

        <div id="stats">
          <div class="stat">
            <span class="stat-label">Strikes</span>
            <span class="stat-value" id="strikes">
              <span class="strike-pip"></span>
              <span class="strike-pip"></span>
              <span class="strike-pip"></span>
            </span>
          </div>
          <div class="stat">
            <span class="stat-label">Streak</span>
            <span class="stat-value" id="streak">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">&lt;15s Perfect</span>
            <span class="stat-value" id="perfect-fast-count">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="total-completed">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Round</span>
            <span class="stat-value" id="round-timer">0:00</span>
          </div>
        </div>
      </main>
    </div>

    <div id="triad-quiz-view" class="hidden">
      <header id="tq-settings">
        <div class="settings-grid tq-grid">
          <label>Mode
            <select id="tq-mode">
              <option value="random">Random</option>
              <option value="keyDrill">Key Drill</option>
            </select>
          </label>
          <label>Root
            <select id="tq-root"></select>
          </label>
          <label>Scale
            <select id="tq-scale"></select>
          </label>
          <label>Position
            <select id="tq-position">
              <option value="0-6">Frets 1–6</option>
              <option value="4-11">Frets 5–11</option>
              <option value="8-15">Frets 9–15</option>
              <option value="11-19">Frets 12–19</option>
              <option value="14-24">Frets 15+</option>
            </select>
          </label>
          <button type="button" id="tq-find-all" class="settings-toggle active">Find All</button>
        </div>
      </header>

      <div id="tq-game">
        <div id="tq-prompt"></div>
        <div id="tq-fretboard"></div>
        <div id="tq-feedback"></div>

        <div id="tq-stats">
          <div class="stat" id="tq-find-all-count" style="display:none">
            <span class="stat-label">Found</span>
            <span class="stat-value" id="tq-find-all-value">0 / 0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Strikes</span>
            <span class="stat-value" id="tq-strikes">
              <span class="strike-pip"></span>
              <span class="strike-pip"></span>
              <span class="strike-pip"></span>
            </span>
          </div>
          <div class="stat">
            <span class="stat-label">Streak</span>
            <span class="stat-value" id="tq-streak">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Round</span>
            <span class="stat-value" id="tq-timer">0:00</span>
          </div>
        </div>
      </div>
    </div>
    <div id="dashboard-view" class="hidden">
      <div id="dashboard">
        <div class="dash-actions">
          <button type="button" id="dash-export" class="dash-btn">Export Data</button>
          <button type="button" id="dash-import-btn" class="dash-btn">Import Data</button>
          <button type="button" id="dash-clear" class="dash-btn dash-btn-danger">Clear History</button>
          <input type="file" id="dash-import" accept=".json" style="display:none">
          <span id="dash-import-status"></span>
        </div>

        <h2 class="dash-section-title">Scale Finder</h2>
        <div class="dash-summary" id="dash-scale-summary"></div>

        <h3 class="dash-group-title">By Key Center</h3>
        <div class="dash-chart" id="dash-scale-keycenter"></div>

        <h3 class="dash-group-title">By Shape</h3>
        <div class="dash-chart" id="dash-scale-shape"></div>

        <h3 class="dash-group-title">By Chord Quality</h3>
        <div class="dash-chart" id="dash-scale-quality"></div>

        <h2 class="dash-section-title">Triad Quiz</h2>
        <div class="dash-summary" id="dash-triad-summary"></div>

        <h3 class="dash-group-title">By Chord Quality</h3>
        <div class="dash-chart" id="dash-triad-quality"></div>

        <h3 class="dash-group-title">By Fret Region</h3>
        <div class="dash-chart" id="dash-triad-region"></div>
      </div>
    </div>
    <div id="version-tag">v5.21</div>
  </div>

  <script src="js/scales.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/history.js"></script>
  <script src="js/game.js"></script>
  <script src="js/triad-quiz.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Triple-tap version tag to clear all caches and force reload
    (function() {
      const tag = document.getElementById('version-tag');
      let taps = 0, timer;
      tag.addEventListener('click', () => {
        taps++;
        clearTimeout(timer);
        if (taps >= 3) {
          taps = 0;
          tag.textContent = 'clearing...';
          caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
            .then(() => navigator.serviceWorker.getRegistrations())
            .then(regs => Promise.all(regs.map(r => r.unregister())))
            .then(() => location.reload(true));
        }
        timer = setTimeout(() => taps = 0, 600);
      });
    })();
  </script>
</body>
</html>
